name: stress

# Repeats a test filter in parallel to reproduce intermittent failures on a hosted runner, whose speed differs
# from the local machines (TRACK.md findings). A dispatch-only workflow cannot be started from a non-default
# branch, so it also runs when this file changes on the track branch, using the defaults below.
on:
  push:
    branches: [track/claude-auto]
    paths: [.github/workflows/stress.yml]
  workflow_dispatch:
    inputs:
      filter:
        description: dotnet test --filter expression
        default: Category=FaultInjection
      project:
        description: Test project
        default: tests/Mindweave.Infrastructure.Tests
      runs:
        description: Runs per parallel worker
        default: "12"
      workers:
        description: Parallel workers
        default: "4"
      os:
        description: Runner
        default: windows-latest

# The token can only read (low finding ci-build-8); inputs reach the shell as environment variables, never pasted
# into the script, so an input cannot inject commands.
permissions:
  contents: read

jobs:
  stress:
    runs-on: ${{ inputs.os || 'windows-latest' }}
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      STRESS_PROJECT: ${{ inputs.project || 'tests/Mindweave.Infrastructure.Tests' }}
      STRESS_FILTER: ${{ inputs.filter || 'Category=FaultInjection' }}
      STRESS_RUNS: ${{ inputs.runs || '4' }}
      STRESS_WORKERS: ${{ inputs.workers || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        shell: pwsh
        run: dotnet build "$env:STRESS_PROJECT" -c Release
      - name: Stress
        shell: pwsh
        run: |
          $workers = [int]$env:STRESS_WORKERS
          $runs = [int]$env:STRESS_RUNS
          $jobs = 1..$workers | ForEach-Object {
            Start-Job -ArgumentList $PWD.Path, $env:STRESS_PROJECT, $env:STRESS_FILTER, $runs -ScriptBlock {
              param($dir, $project, $filter, $runs)
              Set-Location $dir
              $failures = @()
              for ($i = 0; $i -lt $runs; $i++) {
                $out = dotnet test $project -c Release --no-build --filter $filter 2>&1 | Out-String
                if ($out -notmatch 'Passed!') { $failures += $out }
              }
              $failures
            }
          }
          $failures = @($jobs | Wait-Job | Receive-Job)
          "failed runs: $($failures.Count) of $($workers * $runs)"
          $failures | Select-Object -First 3 | ForEach-Object { "----"; $_ }
          if ($failures.Count -gt 0) { exit 1 }
