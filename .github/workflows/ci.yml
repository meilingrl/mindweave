name: ci

on:
  push:
    branches: [track/claude-auto]
  pull_request:
    branches: [track/claude-auto]
  workflow_dispatch:
    inputs:
      macos:
        description: Also run on macOS (billed at 10x on private repositories)
        type: boolean
        default: false

# The token can only read (low finding ci-build-8).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      # Actions are pinned to the commit their tag named on 2026-11-14 (a tag can be moved; a commit cannot).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          # global.json accepts any .NET 10 feature band; CI uses the newest one.
          dotnet-version: 10.0.x
      # Formulas are drawn by RaTeX with system fonts; without a CJK font a formula containing Chinese falls back
      # to its LaTeX source. Desktop macOS and Windows ship such fonts; the Ubuntu runner does not.
      - name: CJK fonts (Linux)
        if: runner.os == 'Linux'
        # Retried: two runs failed at this step on a mirror hiccup (health check 2026-11-12, item 7).
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends fonts-noto-cjk && exit 0
            echo "attempt $attempt failed; retrying"; sleep 20
          done
          exit 1
      - name: Restore
        run: dotnet restore Mindweave.slnx
      # Any package, direct or pulled in by another, with a published security advisory fails the run, on every push
      # (decision 2026-11-14, instead of Dependabot, which reads only main, where no code lives).
      - name: Known-vulnerable packages
        shell: bash
        run: |
          dotnet list Mindweave.slnx package --vulnerable --include-transitive --format json > vulnerable.json
          count=$(jq '[.. | objects | .vulnerabilities? // empty | .[]] | length' vulnerable.json)
          if [ "$count" -ne 0 ]; then
            dotnet list Mindweave.slnx package --vulnerable --include-transitive
            echo "::error::$count known vulnerabilities in the packages above"
            exit 1
          fi
          echo "No known-vulnerable packages."
      - name: Build (warnings are errors)
        run: dotnet build Mindweave.slnx --no-restore -c Release
      - name: Test
        run: dotnet test Mindweave.slnx --no-build -c Release
