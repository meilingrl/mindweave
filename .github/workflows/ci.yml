name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      macos:
        description: Also run on macOS (billed at 10x on private repositories)
        type: boolean
        default: false

# The token can only read (low finding ci-build-8).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
        # The desktop tests run one after another inside a process (one UI thread), and they are most of the time.
        # So each system runs them as three shards, each on a machine of its own, beside one machine for everything
        # else (docs/design/testing.md). The number of desktop parts here is DESKTOP_SHARDS below.
        part: [rest, desktop-0, desktop-1, desktop-2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DESKTOP_SHARDS: 3
    steps:
      # Actions are pinned to the commit their tag named on 2026-11-14 (a tag can be moved; a commit cannot).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          # global.json accepts any .NET 10 feature band; CI uses the newest one.
          dotnet-version: 10.0.x
      # Formulas are drawn by RaTeX with system fonts; without a CJK font a formula containing Chinese falls back
      # to its LaTeX source. Desktop macOS and Windows ship such fonts; the Ubuntu runner does not.
      # The package (61 MB) comes from the runner's Ubuntu mirror, which has stalled or failed for whole runs (health
      # check 2026-11-12, item 7; runs 44782569061 and 44804477512 on 2026-11-20/21). Once downloaded it is kept in the
      # Actions cache, so later runs do not depend on the mirror; a download is still retried and time-limited.
      - name: CJK fonts cache (Linux)
        if: runner.os == 'Linux'
        id: fonts-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/fonts-deb
          key: fonts-noto-cjk-${{ runner.os }}-v1
      - name: CJK fonts (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: |
          mkdir -p ~/fonts-deb
          if ! ls ~/fonts-deb/fonts-noto-cjk_*.deb >/dev/null 2>&1; then
            apt_opts="-o Acquire::http::Timeout=30 -o Acquire::Retries=2"
            got=
            for attempt in 1 2 3; do
              if sudo timeout 150 apt-get update -q $apt_opts \
                && (cd ~/fonts-deb && timeout 240 apt-get download -q $apt_opts fonts-noto-cjk); then
                got=1; break
              fi
              echo "attempt $attempt failed; retrying"; rm -f ~/fonts-deb/*.deb; sleep 10
            done
            [ -n "$got" ] || exit 1
          fi
          sudo dpkg -i ~/fonts-deb/fonts-noto-cjk_*.deb
      - name: Save CJK fonts cache (Linux)
        if: runner.os == 'Linux' && steps.fonts-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/fonts-deb
          key: fonts-noto-cjk-${{ runner.os }}-v1
      - name: Restore
        run: dotnet restore Mindweave.slnx
      # Any package, direct or pulled in by another, with a published security advisory fails the run, on every push
      # (decision 2026-11-14, instead of Dependabot, which reads only main, where no code lives).
      - name: Known-vulnerable packages
        if: matrix.part == 'rest'
        shell: bash
        run: |
          dotnet list Mindweave.slnx package --vulnerable --include-transitive --format json > vulnerable.json
          count=$(jq '[.. | objects | .vulnerabilities? // empty | .[]] | length' vulnerable.json)
          if [ "$count" -ne 0 ]; then
            dotnet list Mindweave.slnx package --vulnerable --include-transitive
            echo "::error::$count known vulnerabilities in the packages above"
            exit 1
          fi
          echo "No known-vulnerable packages."
      - name: Build (warnings are errors)
        run: dotnet build Mindweave.slnx --no-restore -c Release
      # Quarantined tests (intermittent, fix pending; docs/design/testing.md) run in the next step and never block.
      - name: Test (all but desktop)
        if: matrix.part == 'rest'
        shell: bash
        run: |
          failed=0
          for project in Core Architecture Infrastructure; do
            dotnet test "tests/Mindweave.$project.Tests" --no-build -c Release --filter "Category!=Quarantine" \
              --logger trx --results-directory test-results || failed=1
          done
          exit $failed
      - name: Test (desktop shard)
        if: matrix.part != 'rest'
        shell: bash
        run: |
          part="${{ matrix.part }}"
          py="$(command -v python3 || command -v python)"
          "$py" -I scripts/test-shards.py run tests/Mindweave.Desktop.Tests/bin/Release/net10.0/Mindweave.Desktop.Tests.dll \
            --shards "$DESKTOP_SHARDS" --only "${part#desktop-}" \
            --timings tests/Mindweave.Desktop.Tests/shard-timings.json --results test-results \
            -- -trait- Category=Quarantine
      - name: Quarantined tests (do not block)
        if: always() && matrix.part == 'rest'
        continue-on-error: true
        run: dotnet test Mindweave.slnx --no-build -c Release --filter "Category=Quarantine"
      # Where the time went; tests over the budget become warnings, never failures (timings vary by runner).
      - name: Test timings
        if: always()
        shell: bash
        run: |
          py="$(command -v python3 || command -v python)"
          "$py" -I scripts/test-timings.py test-results --github || true
