* { box-sizing: border-box; }

header .how { margin: 10px 0 0; color: var(--muted); max-width: 62ch; }

.picture { margin: 20px 0 6px; border: 1px solid var(--divider); border-radius: 10px; background: var(--canvas);

.stage { position: relative; }
.stage svg { display: block; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.4; }
.edge.main { stroke-dasharray: 1 5; stroke-linecap: round; stroke-width: 1.8; }

.dot:hover { fill: var(--dot-hover); }
.dot:focus { outline: none; }
.sring { fill: none; stroke: var(--dot); stroke-width: 1.2; pointer-events: none; }
.halo { fill: var(--halo); pointer-events: none; display: none; }
.sel { fill: none; stroke: var(--ring); stroke-width: 1.6; pointer-events: none; display: none; }
.node.on .halo, .node.on .sel, .node:focus-within .sel { display: inline; }
.lbl { position: absolute; width: 132px; margin-left: -66px; text-align: center; font-size: 12px; line-height: 1.35; overflow-wrap: anywhere;

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("mindweave-export").textContent);
const TEXT = JSON.parse(document.getElementById("page-text").textContent);
{{#content}}
const DRAWN = JSON.parse(document.getElementById("page-drawn").textContent);
{{/content}}

// ── Elements. Text is always set as text, never as markup. ──────────────────────────────────────────────────────────
const apply = (e, attrs, kids) => {
  for (const [k, v] of Object.entries(attrs)) k.startsWith("on") ? e.addEventListener(k.slice(2), v) : e.setAttribute(k, v);
  for (const k of kids.flat()) if (k != null) e.append(k);
  return e;
};
const $ = (tag, attrs = {}, ...kids) => apply(document.createElement(tag), attrs, kids);
const svg = (tag, attrs = {}, ...kids) => apply(document.createElementNS("http://www.w3.org/2000/svg", tag), attrs, kids);

// ── The path: conversations in start order, and the branches of each. ───────────────────────────────────────────────
const convs = DATA.conversations.map(c => ({ ...c, at: new Date(c.started_at) }))
  .sort((a, b) => a.at - b.at || (a.id < b.id ? -1 : 1));
const byId = new Map(convs.map(c => [c.id, c]));
const kids = new Map(convs.map(c => [c.id, []]));
for (const c of convs) if (byId.has(c.parent)) kids.get(c.parent).push(c);
const roots = convs.filter(c => !byId.has(c.parent));

// A dot's weight: the questions asked in it and in its branches. A branch can start before its parent only if a clock
// was set back, so the order is the tree's own, leaves first.
const tree = [];
for (const stack = [...roots]; stack.length;) { const c = stack.pop(); tree.push(c); stack.push(...kids.get(c.id)); }
for (const c of tree.reverse()) c.weight = Math.max(c.questions, 1) + kids.get(c.id).reduce((s, k) => s + k.weight, 0);
const radius = w => Math.min(14, Math.max(5, 5 + 1.3765 * Math.sqrt(Math.max(0, w - 1))));

// ── The timeline, by the app's rules (session-network §5.1). Roots on the main line in start order, with a wider gap
// between days in the reader's zone; a root's children open new lanes above or below; below a root, a first child
// continues its parent's lane and further children open lanes on the same side. ─────────────────────────────────────
const STEP = 148, LANE = 86, DEEPEST = 10;
const sameDay = (a, b) => a.toDateString() === b.toDateString();
const pos = new Map(), dayStarts = new Set();
(() => {
  const end = new Map();
  const endOf = l => end.get(l) ?? -Infinity;

// ── Choosing a dot or a title shows what the share says about it. ───────────────────────────────────────────────────
function choose(id, reveal) {

  showChosen();
  if (reveal) {
    const dot = parts.get(id)[2].getBoundingClientRect(), box = picture.getBoundingClientRect();
    if (dot.left < box.left + 70 || dot.right > box.right - 70) picture.scrollLeft += dot.left - box.left - box.width / 2;
  }
}

function showChosen() {
  for (const [id, elements] of parts) {
    for (const e of elements) e.classList.toggle("on", id === state.chosen);
    elements[2].setAttribute("aria-pressed", String(id === state.chosen));

  const c = byId.get(state.chosen), { t, name, time } = words;

  pick.replaceChildren(...(!c ? [] : [$("div", { class: "t" }, name(c)),
    $("div", { class: "m" }, [say(t.started, { time: time(c.at) }), count(t.questions, c.questions), ...(c.has_summary ? [t.has_summary] : [])].join(" · "))]));

{{/structure}}

// ── Reading a conversation. ─────────────────────────────────────────────────────────────────────────────────────────
// What was asked and answered, from the data; answers and summaries as they were drawn when the file was saved.
const branchesOf = new Map();
for (const c of convs) if (c.source) branchesOf.set(c.source.message, [...(branchesOf.get(c.source.message) ?? []), c]);
const opened = new Set(), still = matchMedia("(prefers-reduced-motion: reduce)");
const bring = (e, block) => e.scrollIntoView({ behavior: still.matches ? "auto" : "smooth", block });
const reveal = e => { for (let d = e.parentElement; d; d = d.parentElement) if (d.tagName === "DETAILS") d.open = true; };
const flash = e => { e.classList.remove("flash"); void e.offsetWidth; e.classList.add("flash"); };

function read(id) {
  choose(id, true);
  pick.focus({ preventScroll: true });
  bring(pick, "start");
}

// Back to the sentence the branch left from, or to the answer when the sentence could not be told for certain.
function back(c) {
  choose(c.parent, true);
  const answer = pick.querySelector(`[data-answer="${c.source.message}"]`);
  if (!answer) { bring(pick, "start"); return; }
  let at = answer.querySelector(`mark[data-branch="${c.id}"]`);
  if (at?.closest(".cut, .clip")) answer.unfold();
  at ??= answer.querySelector(`[data-left="${c.id}"]`) ?? answer;
  at.focus({ preventScroll: true });
  bring(at, "center");
  flash(at);
}

// An element the page knows by name; its text is always set as text. Anything else is drawn as its parts.
const TAGS = new Set(["p", "h1", "h2", "h3", "h4", "h5", "h6", "ul", "ol", "li", "blockquote", "pre", "code", "em", "strong", "del", "ins", "sub", "sup", "tr", "br", "hr"]);
const isAddress = url => /^(https?|mailto):/i.test(url);
function draw(node, answer) {
  if (typeof node === "string") return document.createTextNode(node);
  const [kind, value, ...rest] = node, parts = () => rest.map(n => draw(n, answer));
  switch (kind) {
    case "table": return $("div", { class: "scroll" }, $("table", {}, parts()));
    case "th": case "td": return $(kind, value ? { style: `text-align:${value === "right" ? "right" : value === "center" ? "center" : "left"}` } : {}, parts());
    case "li": return $("li", value ? { class: "task" } : {}, parts());
    case "hl": return $("span", { class: "hl" }, parts());
    case "task": return $("input", { type: "checkbox", disabled: "", ...(value ? { checked: "" } : {}) });
    case "a": return isAddress(value) ? $("a", { href: value, rel: "noreferrer noopener", target: "_blank", title: value }, parts()) : $("span", { title: value }, parts());
    case "cite": {
      const n = value, to = $("button", { type: "button", class: "c", title: say(words.t.to_citation, { n }), onclick: () => {
        const item = answer?.querySelector(`[data-cite="${n}"]`);
        if (item) { reveal(item); bring(item, "center"); flash(item); }
      } }, parts());
      return to;
    }
    case "mark": {
      const branch = byId.get(value), go = e => { e.preventDefault(); e.stopPropagation(); read(value); };
      return $("mark", { "data-branch": value, tabindex: 0, role: "link", title: say(words.t.into, { name: words.name(branch) }), onclick: go,
        onkeydown: e => { if (e.key === "Enter") go(e); } }, parts());
    }
    case "math": return formula($("span"), value, false);
    case "mathblock": return formula($("div", { class: "formula" }), value, true);

}

// A formula the library cannot read is shown as it was written.
function formula(into, tex, displayMode) {

  try {
    katex.render(tex, into, { displayMode, throwOnError: true, strict: "ignore", trust: false, maxSize: 50, maxExpand: 500 });
    return into;
  } catch { into.replaceChildren(); }

  into.classList.add("source");
  into.append(tex);
  return into;
}

const drawn = (id, answer) => (DRAWN[id] ?? []).map(n => draw(n, answer));

// Wide characters count twice, as they take twice the room.
const room = text => [...text].reduce((s, ch) => s + (ch > "\u2E7F" ? 2 : 1), 0);

// Folded at a block's end: the first blocks up to a few lines, never ending on a heading, and only when enough is hidden to be worth it.
function fold(blocks) {
  const rooms = blocks.map(b => Math.max(room(b.textContent), 60)), total = rooms.reduce((a, b) => a + b, 0);
  let shown = 0, n = 0;
  while (n < blocks.length && (shown < 200 || /^H\d$/.test(blocks[n - 1].tagName))) shown += rooms[n++];
  if (total - shown < 120) { n = blocks.length; shown = total; }
  return { n, clip: rooms.slice(0, n).some(r => r > 900) };
}

function answered(m) {
  const { t, name } = words;
  const box = $("div", { class: "a" + (m.replaced_by ? " earlier" : ""), "data-answer": m.id, tabindex: -1 });
  const body = $("div", { class: "md" }, drawn(m.id, box)), blocks = [...body.children];
  const { n, clip } = m.replaced_by ? { n: 0, clip: false } : fold(blocks), folds = n < blocks.length || clip;
  const toggle = $("button", { type: "button", class: "fold", onclick: () => { opened.has(m.id) ? opened.delete(m.id) : opened.add(m.id); show(); } });
  const show = () => {
    const open = opened.has(m.id) || !folds;
    box.classList.toggle("folded", !open);
    blocks.forEach((b, i) => {
      b.classList.toggle("cut", !open && i >= n);
      b.classList.toggle("clip", !open && clip && i < n && room(b.textContent) > 900);

  const left = branchesOf.get(m.id) ?? [];
  const cites = m.citations ?? [];
  box.append(...[
    m.replaced_by ? $("p", { class: "label" }, t.earlier) : null,
    steps.length ? $("div", { class: "activity" }, steps.join(" · ")) : null,
    body,
    folds ? toggle : null,
    m.state !== "complete" ? $("div", {}, $("span", { class: "badge" }, t.incomplete)) : null,
    left.length ? $("ul", { class: "left", "aria-label": t.branches }, left.map(b => $("li", {},
      $("button", { type: "button", class: "linkish", "data-left": b.id, onclick: () => read(b.id) }, name(b)), $("span", { class: "n" }, count(t.questions, b.questions))))) : null,
    cites.length ? $("details", { class: "cites" }, $("summary", {}, count(t.citations, cites.length)), $("ol", {}, cites.map(cited))) : null,
  ].filter(e => e));
  box.title = words.time(new Date(m.at));
  return box;
}

function cited(c) {
  const { t } = words, shared = byId.get(c.conversation);
  const what = c.kind === "web" ? (c.url ? [(c.title ?? "") + " ", isAddress(c.url) ? $("a", { href: c.url, rel: "noreferrer noopener", target: "_blank" }, c.url) : c.url] : [])
    : shared ? [$("button", { type: "button", class: "linkish", onclick: () => read(shared.id) }, say(t.cite_shared_summary, { name: c.title }))]
    : [t["cite_" + c.kind]];

}

function asked(m) {
  const { t } = words, names = m.attachments ?? [];
  return [
    m.text ? $("div", { class: "q", title: words.time(new Date(m.at)) }, m.text) : null,
    names.length ? $("div", { class: "attrow" }, names.map(n => $("span", { class: "att" }, n === null ? t.pasted : say(t.attachment, { name: n })))) : null,

function conversation(c) {

    c.summary ? $("details", { class: "summary" }, $("summary", { title: time(new Date(c.summary.at)) }, t.summary), $("div", { class: "body md" }, $("h4", {}, c.summary.title), drawn(c.summary.id, null))) : null,
    ...turns,

}
